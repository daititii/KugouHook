name: Build & Release

# 两条触发路径，职责分开：
#
#   push → main   只构建：跑编译、R8 检查、把 APK 传成 workflow artifact。
#                 **不创建 Release**，不碰 tag。产物在 run 页面底部下载。
#
#   手动触发       构建 + 发布。默认发**预发布**（prerelease）；勾选 stable 才发正式版。
#
# 为什么 push 不发版：每次提交都产出一个 Release，版本列表会迅速变成一堆没人验证过的包，
# "最新版"也就失去了意义。构建产物本来就能在 run 里拿到，Release 应该只留决定要发的那几个。
#
# 为什么默认预发布：自动构建只证明"能编出来、入口类没被 R8 吃掉"，不证明在本机装上去有效。
# prerelease 不会被 GitHub 当作 latest，所以"最新正式版"始终指向你亲自确认过的那一版。

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'
      - '.github/workflows/release.yml'
  workflow_dispatch:
    inputs:
      stable:
        description: '发为正式版（默认预发布）'
        required: false
        type: boolean
        default: false
      force:
        description: '该版本已有 Release 时仍然覆盖'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: build-main
  cancel-in-progress: false

jobs:
  guard:
    name: 版本与一致性检查
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.ver.outputs.tag }}
      version_name: ${{ steps.ver.outputs.version_name }}
      version_code: ${{ steps.ver.outputs.version_code }}
    steps:
      - uses: actions/checkout@v5

      - name: 读取版本号并校验与 build.gradle.kts 一致
        id: ver
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          prop=app/src/main/resources/META-INF/xposed/module.prop
          gradle_file=app/build.gradle.kts

          prop_code=$(grep -E '^versionCode=' "$prop" | cut -d= -f2 | tr -d '[:space:]')
          prop_name=$(grep -E '^version=' "$prop" | cut -d= -f2 | tr -d '[:space:]' | sed 's/^v//')

          # 版本号在两处重复声明（module.prop 给 LSPosed 读，gradle 决定 APK 自身的
          # versionCode / versionName）。只改一处是最容易发生、又最不容易发现的事故：
          # 前者不变 → 用户看不到更新；后者不变 → 系统认为装的还是旧包。
          gradle_code=$(sed -nE 's/^[[:space:]]*versionCode[[:space:]]*=[[:space:]]*([0-9]+).*/\1/p' "$gradle_file" | head -1)
          gradle_name=$(sed -nE 's/^[[:space:]]*versionName[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' "$gradle_file" | head -1)

          echo "module.prop: $prop_code / $prop_name"
          echo "gradle     : $gradle_code / $gradle_name"

          if [ "$prop_code" != "$gradle_code" ]; then
            echo "::error::versionCode 不一致（module.prop=$prop_code, build.gradle.kts=$gradle_code），先对齐再发版"
            exit 1
          fi
          if [ "$prop_name" != "$gradle_name" ]; then
            echo "::error::versionName 不一致（module.prop=$prop_name, build.gradle.kts=$gradle_name），先对齐再发版"
            exit 1
          fi

          echo "version_code=$prop_code" >> "$GITHUB_OUTPUT"
          echo "version_name=$prop_name" >> "$GITHUB_OUTPUT"
          echo "tag=v${prop_name}" >> "$GITHUB_OUTPUT"

          # push 只构建，不必检查同名 Release；只有手动发布时才需要提前拦重复。
          if [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            exit 0
          fi
          if [ "${{ github.event.inputs.force || 'false' }}" = "true" ]; then
            echo "force=true，允许覆盖已有 Release"
            exit 0
          fi
          if gh release view "v${prop_name}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "::error::v${prop_name} 已有 Release。要覆盖请手动触发并勾选 force；要发新版本请先升版本号"
            exit 1
          fi

  build:
    name: 构建
    needs: guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: 设置 JDK 21
        # 与本地验证环境一致（AGP 9 + Gradle 9.4 在 JDK 21 上跑通）。
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: 缓存 Gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: 配置固定签名（有 secret 就用，没有就退回 debug 签名）
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
          KEYSTORE_KEY_PASSWORD: ${{ secrets.KEYSTORE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "${KEYSTORE_BASE64:-}" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/keystore.jks"
            {
              echo "KEYSTORE_PATH=$RUNNER_TEMP/keystore.jks"
              echo "KEYSTORE_PASSWORD=${KEYSTORE_PASSWORD:-android}"
              echo "KEYSTORE_ALIAS=${KEYSTORE_ALIAS:-androiddebugkey}"
              echo "KEYSTORE_KEY_PASSWORD=${KEYSTORE_KEY_PASSWORD:-android}"
            } >> "$GITHUB_ENV"
            echo "使用 KEYSTORE_BASE64 提供的固定签名"
          else
            echo "::warning::未配置 KEYSTORE_BASE64，本次使用 runner 现生成的 debug 签名 —— 与历史版本签名不一致，设备上更新模块需要先卸载"
          fi

      - name: 构建
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: 校验产物（R8 是否吃掉了模块入口）
        # 这一步是本项目血泪教训的固化：Debug 不走 R8，proguard 规则写错在本地完全看不出来，
        # 只有装到手机上才发现模块静默不生效。这里直接检查 java_init.list 引用的类名
        # 是否真的存在于 dex 中，把问题挡在发布之前。
        run: |
          python3 - <<'PY'
          import re, sys, zipfile, pathlib

          apk = pathlib.Path("app/build/outputs/apk/release/app-release.apk")
          if not apk.is_file():
              sys.exit(f"找不到产物 {apk}")

          with zipfile.ZipFile(apk) as z:
              names = z.namelist()
              for required in ("META-INF/xposed/module.prop",
                               "META-INF/xposed/java_init.list",
                               "META-INF/xposed/scope.list"):
                  if required not in names:
                      sys.exit(f"APK 里缺少 {required}")
              entries = z.read("META-INF/xposed/java_init.list").decode().split()
              dex = b"".join(z.read(n) for n in names if re.fullmatch(r"classes\d*\.dex", n))
              prop = z.read("META-INF/xposed/module.prop").decode()

          print(f"APK: {apk} ({apk.stat().st_size} bytes, dex {len(dex)} bytes)")
          if not entries:
              sys.exit("java_init.list 为空")

          for entry in entries:
              desc = ("L" + entry.strip().replace(".", "/") + ";").encode()
              present = desc in dex
              print(f"  入口 {entry}: {'OK' if present else '缺失'}")
              if not present:
                  sys.exit(f"入口类 {entry} 不在 dex 里 —— R8 把它改名或删了，检查 proguard-rules.pro 的 -keep")

          print("module.prop:")
          for line in prop.splitlines():
              if line.startswith(("version", "versionCode")):
                  print("  " + line)
          PY

      - name: 保存产物
        # push 触发的构建到此为止 —— 产物在 run 页面的 Artifacts 里下载，不创建 Release。
        uses: actions/upload-artifact@v4
        with:
          name: KugouHook-${{ needs.guard.outputs.version_name }}-${{ github.sha }}
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: 准备更新说明
        if: github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          ver="${{ needs.guard.outputs.version_name }}"
          section=""
          # 按 CHANGELOG.md 里「## x.x.x」段取更新说明；找不到就退回提交记录。
          if [ -f CHANGELOG.md ]; then
            section=$(awk -v v="$ver" '
              /^## / { t = $2; sub(/^v/, "", t); flag = (t == v) ; next }
              flag { print }
            ' CHANGELOG.md | sed '/^[[:space:]]*$/d')
          fi
          if [ -n "$section" ]; then
            printf '更新内容:\n%s\n' "$section" > RELEASE_NOTES.md
          else
            printf '更新内容:\n' > RELEASE_NOTES.md
            git log --no-merges --pretty='- %s' -10 >> RELEASE_NOTES.md
          fi
          echo "" >> RELEASE_NOTES.md
          echo "构建自 \`${{ github.sha }}\`" >> RELEASE_NOTES.md
          echo "---- RELEASE_NOTES.md ----"
          cat RELEASE_NOTES.md

      - name: 发布 Release（仅手动触发）
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${{ needs.guard.outputs.tag }}"
          apk=app/build/outputs/apk/release/app-release.apk

          # force：同 tag 已存在时先删再建（gh 不允许同名重复创建）。
          if gh release view "$tag" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "覆盖已有 Release $tag"
            gh release delete "$tag" --repo "${{ github.repository }}" --yes
          fi

          # --prerelease 与 --latest 互斥：预发布不能被当成最新正式版。
          if [ "${{ github.event.inputs.stable || 'false' }}" = "true" ]; then
            echo "发布正式版 $tag"
            gh release create "$tag" "$apk" \
              --repo "${{ github.repository }}" \
              --title "KugouHook ${tag}" \
              --notes-file RELEASE_NOTES.md \
              --latest
          else
            echo "发布预发布 $tag"
            gh release create "$tag" "$apk" \
              --repo "${{ github.repository }}" \
              --title "KugouHook ${tag} (预发布)" \
              --notes-file RELEASE_NOTES.md \
              --prerelease
          fi
